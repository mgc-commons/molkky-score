<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MÖLKKY DAYS | 得点投影</title><style>
:root{--ink:#294f43;--green:#247a60;--soft:#e8f5ec;--line:#dce9df}*{box-sizing:border-box}body{margin:0;background:#f6f8f4;color:var(--ink);font-family:'Yu Gothic','Hiragino Kaku Gothic ProN',system-ui,sans-serif}.page{min-height:100vh;padding:2.2vw 3vw;display:flex;flex-direction:column;gap:1.5vw}.head{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:clamp(22px,2.4vw,42px);font-weight:900;letter-spacing:.07em}.pill{background:#d9f1e3;color:#22664b;border-radius:99px;padding:12px 23px;font-weight:900;font-size:clamp(17px,1.5vw,28px)}.title{font-size:clamp(25px,3.1vw,58px);font-weight:900}.sub{font-size:clamp(16px,1.5vw,28px);color:#648175}.scoregrid{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.5vw;align-content:stretch}.team{background:#fff;border:3px solid #e0eae1;border-radius:28px;padding:2vw;display:flex;flex-direction:column;justify-content:center;min-height:190px}.team.active{background:#e4f5e9;border:5px solid #27845b;box-shadow:0 10px 30px #267d4b22}.team.winner{background:#fff0db;border-color:#d8a25e}.teamname{font-weight:900;font-size:clamp(22px,2.5vw,49px);line-height:1.3;overflow-wrap:anywhere}.score{font-size:clamp(74px,10vw,190px);font-weight:900;line-height:1.08;text-align:center;font-variant-numeric:tabular-nums}.score small{font-size:.23em;color:#82968a}.hint{font-size:clamp(16px,1.4vw,27px);font-weight:800;color:#357759}.foot{display:flex;justify-content:space-between;gap:15px;align-items:center;font-size:clamp(16px,1.35vw,26px);color:#57776b}.timer{font-size:clamp(28px,3vw,55px);font-weight:900;font-variant-numeric:tabular-nums;color:#26785d}.message{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:white;border-radius:30px;padding:4vw;gap:20px}.message strong{font-size:clamp(34px,4vw,76px)}.message p{font-size:clamp(20px,2.3vw,44px);line-height:1.5;margin:0}.error{color:#9b4949}.hidden{display:none!important}@media(max-width:700px){.page{padding:16px;gap:16px}.scoregrid{grid-template-columns:1fr;gap:12px}.team{padding:15px;min-height:135px}.score{font-size:74px}.head{flex-wrap:wrap}.foot{flex-wrap:wrap}}
</style></head><body><main class="page"><header class="head"><div class="brand">MÖLKKY DAYS <span style="font-size:.5em;color:#719080">SCORE BOARD</span></div><div class="pill" id="status">接続中…</div></header><section id="matchView" class="hidden" style="flex:1;display:flex;flex-direction:column;gap:1.5vw"><div><div class="title" id="matchTitle"></div><div class="sub" id="matchSub"></div></div><div class="scoregrid" id="scores"></div><footer class="foot"><div id="turnInfo"></div><div class="timer" id="timer"></div></footer></section><section id="emptyView" class="message"><strong id="emptyTitle">試合情報を取得しています</strong><p id="emptyText">しばらくお待ちください。</p></section><div class="sub" style="text-align:right" id="updated"></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://lejycjqmigukhdppbdbe.supabase.co','sb_publishable_uTkkThPaCAKf_bQJWF5pig_dWGvMwcZ',{realtime:{params:{eventsPerSecond:10}}});
const dates={A:'2026-12-03',B:'2026-12-02',C:'2026-11-16',D:'2026-11-19',E:'2026-11-25',F:'2026-12-04',G:'2026-11-11',H:'2026-12-01'};
const teams={A:['KENTOBU-H','経理グループ選抜','ラーニングサークル同窓会','team アミン'],B:['HPP①','逆スライダー','筋トレ部B','モルラボ'],C:['原田JAPAN','チーム26卒','情シス','2001'],D:['おでんにちくわぶ忘れないで','宮司さんと仲間たち','男子材料事業部','モルック組合'],E:['HPP②','優勝候補','KENTOBU-K','モフコーンS'],F:['KENTOBU-T','ZA!MU','筋トレ部A','チエの輪'],G:['LHS','おおまさり','さいさりす','名刺交換からお願いします'],H:['僕らのプラネット','MMOBTS','よっこら会']};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let matches=[],offset=0,chosen=null,lastError=false;const now=()=>Date.now()+offset;const localDate=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(now()));
const roundName=m=>m.round_number===(m.league==='H'?3:4)?'リーグ決定戦':`第${m.round_number}試合`;
function choose(){const active=matches.filter(m=>m.winner==null&&m.timer_started_at!=null);if(active.length){active.sort((a,b)=>{const aToday=dates[a.league]===localDate()?1:0,bToday=dates[b.league]===localDate()?1:0;return bToday-aToday||Date.parse(b.timer_started_at)-Date.parse(a.timer_started_at)||a.league.localeCompare(b.league)});return {type:'active',match:active[0]}}
 const today=localDate();const upcoming=Object.entries(dates).sort((a,b)=>a[1].localeCompare(b[1]));const next=upcoming.find(([l,d])=>d>=today)||upcoming[upcoming.length-1];return {type:'scheduled',league:next[0],date:next[1]}}
function render(){if(lastError)return;chosen=choose();$('updated').textContent='自動更新中 · '+new Date().toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo'});if(chosen.type==='scheduled'){$('matchView').classList.add('hidden');$('emptyView').classList.remove('hidden');$('status').textContent='開催予定';$('emptyTitle').textContent=`${chosen.league}リーグ · ${chosen.date.slice(5).replace('-','/')} 開催`;$('emptyText').textContent='現在進行中の試合はありません。\n次回のリーグ戦の得点画面を待機しています。';$('emptyText').style.whiteSpace='pre-line';return}
 const m=chosen.match,order=Array.isArray(m.turn_order)&&m.turn_order.length===m.teams.length&&new Set(m.turn_order).size===m.teams.length&&m.turn_order.every(i=>Number.isInteger(i)&&i>=0&&i<m.teams.length)?m.turn_order:m.teams.map((_,i)=>i);const turn=order[(m.turn_index||0)%order.length];$('matchView').classList.remove('hidden');$('emptyView').classList.add('hidden');$('status').textContent='試合中';$('matchTitle').textContent=`${m.league}リーグ · ${roundName(m)}`;$('matchSub').textContent=`${dates[m.league].slice(5).replace('-','/')} 開催 · ${m.teams.length}チーム`;$('scores').innerHTML=order.map((i,j)=>`<article class="team ${i===turn?'active':''} ${m.winner===m.teams[i]?'winner':''}"><div class="teamname">${j+1}番 · ${esc(m.teams[i])}</div><div class="score">${Number(m.scores?.[i]??0)}<small> / 30</small></div><div class="hint">${i===turn?'● 投擲順：現在のチーム':'　'}</div></article>`).join('');$('turnInfo').textContent=`次の投擲：${m.teams[turn]}`;tick()}
function tick(){if(!chosen||chosen.type!=='active')return;const m=chosen.match;if(m.timer_paused_remaining_seconds!=null){$('timer').textContent='一時停止 '+fmt(m.timer_paused_remaining_seconds);return}const left=Math.max(0,Math.ceil((Number(m.timer_duration_seconds||900)*1000-(now()-Date.parse(m.timer_started_at)))/1000));$('timer').textContent='残り '+fmt(left)}
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
async function refresh(){try{const {data,error}=await supabase.from('molkky_matches').select('id,league,round_number,teams,scores,winner,turn_index,turn_order,timer_started_at,timer_duration_seconds,timer_paused_remaining_seconds,updated_at');if(error)throw error;matches=data||[];lastError=false;render()}catch(e){console.error(e);lastError=true;$('matchView').classList.add('hidden');$('emptyView').classList.remove('hidden');$('status').textContent='接続エラー';$('emptyTitle').textContent='得点データを取得できません';$('emptyText').textContent='ネットワークとSupabaseの閲覧権限をご確認ください。'}}
async function clock(){try{const before=Date.now(),{data,error}=await supabase.rpc('molkky_server_time');if(!error&&data)offset=Date.parse(data)-(before+Date.now())/2}catch(e){console.warn(e)}}
await clock();await refresh();supabase.channel('molkky-display-live').on('postgres_changes',{event:'*',schema:'public',table:'molkky_matches'},()=>refresh()).subscribe();setInterval(refresh,5000);setInterval(tick,500);setInterval(clock,60000);
</script></body></html>
