<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>決勝大会 得点盤</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="board.css"><style>.display .welcome{position:fixed;inset:0;z-index:1;display:grid;grid-template-rows:repeat(2,minmax(0,1fr));padding:0;gap:0;color:#294c43;background:#edf5ef;overflow:hidden}.display .welcome[hidden]{display:none}.welcome>div{min-height:0;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden}.welcome-top{background:radial-gradient(ellipse at 85% 0%,#d4e8da,transparent 65%),#edf5ef;padding:2vh 4vw}.welcome .date{font-size:min(4.8vw,8vh);font-weight:700;letter-spacing:.08em}.welcome h1{font-size:min(8.4vw,15vh);line-height:1.15;margin:1.5vh 0;font-weight:900;letter-spacing:.04em}.welcome-bottom{border-top:3px solid #78988b;background:linear-gradient(115deg,#dcebe1,#f4f8f3);position:relative;padding:2vh 4vw}.welcome-bottom .eyebrow{font-size:min(1.8vw,3vh);letter-spacing:.35em;font-weight:700;color:#527463}.welcome-bottom h2{font-size:min(4.6vw,8vh);margin:1.8vh 0;font-weight:800;letter-spacing:.05em}.welcome-bottom p{font-size:min(2.5vw,4.4vh);margin:.5vh 0;line-height:1.6}.welcome-bottom .wood{display:flex;gap:1.2vw;margin-top:2vh;align-items:center}.wood span{display:grid;place-items:center;width:min(5vw,7vh);height:min(5vw,7vh);border-radius:50%;background:repeating-radial-gradient(ellipse at 40% 45%,#e6c79d 0px,#e6c79d 3px,#cba77b 4px,#efd6b1 6px);box-shadow:0 4px 0 #a37d50,0 7px 10px #294c4330,inset 0 0 5px #99734b;color:#513d29;font-size:min(2.5vw,4vh);font-weight:800;transform:rotate(-8deg)}.display #status{z-index:3}@media(max-width:650px) and (orientation:portrait){.welcome .date{font-size:5.5vw}.welcome h1{font-size:10vw}.welcome-bottom .eyebrow{font-size:3vw}.welcome-bottom h2{font-size:6vw}.welcome-bottom p{font-size:4vw}.wood span{width:9vw;height:9vw;font-size:5vw}}.welcome-bottom{background:#e4efe7}.welcome-bottom .wait-message{font-size:min(4vw,7vh);font-weight:600;letter-spacing:.06em;color:#456456;margin:0}.welcome-top{background:#f2f7f3}@media(max-width:650px) and (orientation:portrait){.welcome-bottom .wait-message{font-size:5vw}}</style><body class="display"><section id="welcome" class="welcome"><div class="welcome-top"><div class="date">12月14日　本社モルック大会</div><h1>決勝大会 得点盤</h1></div><div class="welcome-bottom"><p class="wait-message">開始までしばらくお待ちください</p></div></section><main><article id="A"></article><article id="B"></article></main><div id="status" role="status">接続確認中</div><script type="module">import {$,watch,esc,remaining,fmt,event} from './common.js';const fit=()=>{document.querySelectorAll('.teamname,.roundname').forEach(el=>{el.style.fontSize='';let n=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth+1&&n>12){n-=1;el.style.fontSize=n+'px'}})};watch(e=>{$("welcome").hidden=Boolean(e.courts?.A||e.courts?.B);for(const c of ['A','B']){const m=e.courts[c];$(c).innerHTML=`<header><h2 class="roundname">${c}コート　${esc(m?.label||'待機中')}</h2><div class="timer" id="time${c}"></div></header>`+(m?`<div class="grid">${m.teams.map((t,i)=>`<div class="team ${m.start&&!m.winner&&m.turn===i?'active':'inactive'} ${m.winner===t?'winner':''}"><div class="teamname">${esc(t)}</div><div class="score">${m.scores[i]}</div><div class="marker">${m.winner===t?'勝利':'&nbsp;'}</div></div>`).join('')}</div>`:'<div class="waiting">次の試合をお待ちください</div>')}tick();fit();queueMicrotask(()=>{if($('status').textContent==='接続中・自動更新')$('status').textContent=''})});function tick(){for(const c of ['A','B']){const m=event?.courts[c],el=$('time'+c);if(el)el.textContent=!m?'':m.winner?'試合終了':!m.start?'開始前':remaining(m)?fmt(remaining(m)):'時間終了'}}setInterval(tick,250);addEventListener('resize',fit);</script></body></html>
