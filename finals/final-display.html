<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>決勝大会 得点盤</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="board.css"><body class="display"><main><article id="A"></article><article id="B"></article></main><div id="status" role="status">接続確認中</div><script type="module">import {$,watch,esc,remaining,fmt,event} from './common.js';const fit=()=>{document.querySelectorAll('.teamname,.roundname').forEach(el=>{el.style.fontSize='';let n=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth+1&&n>12){n-=1;el.style.fontSize=n+'px'}})};watch(e=>{for(const c of ['A','B']){const m=e.courts[c];$(c).innerHTML=`<header><h2 class="roundname">${c}コート　${esc(m?.label||'待機中')}</h2><div class="timer" id="time${c}"></div></header>`+(m?`<div class="grid">${m.teams.map((t,i)=>`<div class="team ${m.start&&!m.winner&&m.turn===i?'active':'inactive'} ${m.winner===t?'winner':''}"><div class="teamname">${esc(t)}</div><div class="score">${m.scores[i]}</div><div class="marker">${m.winner===t?'勝利':'&nbsp;'}</div></div>`).join('')}</div>`:'<div class="waiting">次の試合をお待ちください</div>')}tick();fit();queueMicrotask(()=>{if($('status').textContent==='接続中・自動更新')$('status').textContent=''})});function tick(){for(const c of ['A','B']){const m=event?.courts[c],el=$('time'+c);if(el)el.textContent=!m?'':m.winner?'試合終了':!m.start?'開始前':remaining(m)?fmt(remaining(m)):'時間終了'}}setInterval(tick,250);addEventListener('resize',fit);</script></body></html>
