<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>順位予想 管理</title><link rel="stylesheet" href="style.css"><body class=""><main><header><div><small>MÖLKKY DAYS / FINAL</small><h1>順位予想 管理</h1></div><small id="status">接続確認中</small></header><section id="login" hidden><h2>運営ログイン</h2><label>パスワード</label><input id="password" type="password"><button id="loginBtn">ログイン</button></section><div id="panel" hidden><section><h2>参加チーム・投票受付</h2><label>8チーム（1行に1チーム）</label><textarea id="teams" rows="8" readonly></textarea><p>代表名は得点管理ページで登録してください。</p><button id="open" class="primary">投票開始</button><button id="close">投票締切</button><p id="state"></p></section><section><h2>所属チーム一覧</h2><p>全参加チームを1行に1チーム入力してください。</p><textarea id="members" rows="12"></textarea><button id="saveMembers">所属チーム一覧を保存</button></section><section><h2>結果・景品判定</h2><div id="result"></div><button id="judge" class="primary">的中判定・抽選</button><button id="refresh">回答一覧更新</button><div id="results"></div></section></div></main><script type="module">import {readVotes,db,$,load,save,event,options,esc,login,auth,safe} from './common.js';$('loginBtn').onclick=safe(login);if(await auth()){await load();$('teams').value=event.teams.join('\n');function render(){ $('teams').value=event.teams.join('\n');$('state').textContent=event.voting?'予想受付中':event.result.length?'順位確定':'受付停止中';$('judge').disabled=event.result.length!==3||event.voting;$('result').innerHTML=[1,2,3].map((n,i)=>`<label>${n}位</label><select disabled id="r${n}">${options(event.teams)}</select>`).join('');event.result.forEach((t,i)=>$('r'+(i+1)).value=t)}render();for(const [id,v] of [['open',true],['close',false]])$(id).onclick=safe(async()=>{await load();if(v&&!event.members.length)throw Error('所属チーム一覧を登録してください');if(event.result.length)throw Error('結果確定済み');await save({voting:v});render()});$('members').value=event.members.join('\n');$('saveMembers').onclick=safe(async()=>{await load();if(event.voting)throw Error('先に締め切ってください');const members=$('members').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!members.length||new Set(members).size!==members.length)throw Error('チーム名を確認してください');await save({members});alert('保存しました')});const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));function tier(p,r){return p.every((x,i)=>x===r[i])?1:same(p,r)?2:p[0]===r[0]&&p[1]===r[1]?3:same(p.slice(0,2),r.slice(0,2))?4:p[0]===r[0]?5:6}async function votes(draw=false){const data=await readVotes();const r=event.result;let rows=data.map(v=>({...v,t:r.length===3?tier(v.picks,r):0}));if(draw){rows=rows.map(v=>({...v,k:crypto.getRandomValues(new Uint32Array(1))[0]})).sort((a,b)=>a.t-b.t||a.k-b.k)}$('results').innerHTML=`<p>回答 ${rows.length}人</p><table><tr><th>所属チーム</th><th>氏名</th><th>予想</th><th>判定</th><th>景品</th></tr>${rows.map((v,i)=>`<tr><td>${esc(v.team)}</td><td>${esc(v.name)}</td><td>${v.picks.map(esc).join(' / ')}</td><td>${['未確定','三連単','三連複','モル単','モル連','モル勝','はずれ'][v.t]}</td><td>${draw&&i<10&&v.t<6?'当選':''}</td></tr>`).join('')}</table>`;if(draw){const blob=new Blob([JSON.stringify(rows.filter((v,i)=>i<10&&v.t<6),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='当選者.json';a.textContent='抽選結果を保存';$('results').prepend(a)}}$('refresh').onclick=safe(async()=>{await load();await votes()});$('judge').onclick=safe(async()=>{const result=[1,2,3].map(i=>$('r'+i).value);if(result.includes('')||new Set(result).size!==3)throw Error('順位を確認');await load();if(event.voting)throw Error('先に投票を締め切ってください');if(!confirm('結果確定・抽選を実施しますか？ 再抽選すると結果が変わります。'))return;if(JSON.stringify(result)!==JSON.stringify(event.result))throw Error('順位が更新されました。再度確認してください');await votes(true)});$('status').textContent='接続中';setInterval(async()=>{try{const v=event.version;await load();if(v!==event.version)render();$('status').textContent='接続中・自動更新'}catch(e){$('status').textContent=e.message}},5000);}</script></body></html>
