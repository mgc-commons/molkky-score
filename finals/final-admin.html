<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>決勝大会 得点管理</title><link rel="stylesheet" href="style.css"><body class=""><main><header><div><small>MÖLKKY DAYS / FINAL</small><h1>決勝大会 得点管理</h1></div><small id="status">接続確認中</small></header><section id="login" hidden><h2>運営ログイン</h2><label>パスワード</label><input id="password" type="password"><button id="loginBtn">ログイン</button></section><div id="panel" hidden><p>公式戦：30点・10分。時間終了時は高得点側が勝利。同点は運営判断。</p><section><h2>代表チーム名の設定</h2><p>各リーグの代表名を入力してください。順位予想ページにも反映されます。投票・競技開始前に登録してください。</p><div id="teamSettings"></div><button id="saveTeamSettings" class="primary">代表チーム名を保存</button></section><section><h2>トーナメント表</h2><div id="bracket"></div></section><section id="A"></section><section id="B"></section><section><h2>確定済み試合</h2><div id="history"></div></section></div></main><script>window.addEventListener("error",e=>{document.getElementById("status").textContent="エラー: "+(e.message||"ファイル読込失敗")},true);window.addEventListener("unhandledrejection",e=>{document.getElementById("status").textContent="エラー: "+(e.reason?.message||e.reason)});</script><script type="module">import {readVotes,db,$,load,save,event,options,esc,remaining,fmt,login,auth,safe} from './common.js?v=20261124r4';$('loginBtn').onclick=safe(login);try{if(await auth()){await load();let busy=false;$('teamSettings').innerHTML=event.teams.map((t,i)=>`<label>${'ABCDEFGH'[i]}リーグ代表</label><input id="teamSetting${i}" value="${esc(t)}" maxlength="80">`).join('');$('saveTeamSettings').onclick=safe(async()=>{if(busy)return;busy=true;try{const teams=Array.from({length:8},(_,i)=>$('teamSetting'+i).value.trim());if(teams.some(t=>!t)||new Set(teams).size!==8)throw Error('異なる8チーム名を入力してください');await load();const count=(await readVotes()).length;if(count||event.voting||event.history.length||Object.values(event.courts).some(Boolean))throw Error('投票・試合準備後は変更できません');await save({teams});render();alert('代表チーム名を保存しました')}finally{busy=false}});const rounds=['準々決勝①','準々決勝②','準々決勝③','準々決勝④','準決勝①','準決勝②','3位決定戦','決勝戦'];const schedule={A:[0,2,4,6,7],B:[1,3,5]};function card(i){const h=event.history;const get=j=>h.find(x=>x.label===rounds[j]);const win=j=>get(j)?.winner;const lose=j=>get(j)?.teams.find(t=>t!==win(j));return i<4?event.teams.slice(i*2,i*2+2):i===4?[win(0),win(1)]:i===5?[win(2),win(3)]:i===6?[lose(4),lose(5)]:[win(4),win(5)]}function next(c){return schedule[c].find(i=>!event.history.some(x=>x.label===rounds[i]))}function bracket(){ $('bracket').innerHTML='<div class="bracket">'+[[0,1,2,3],[4,5],[7],[6]].map((group,k)=>`<div><h3>${['準々決勝','準決勝','決勝','3位決定戦'][k]}</h3>${group.map(i=>{const h=event.history.find(x=>x.label===rounds[i]);return `<div class="bracketmatch"><small>${rounds[i]}</small>${card(i).map(t=>`<div class="${t&&h?.winner===t?'won':''}">${esc(t||'未確定')}</div>`).join('')}</div>`}).join('')}</div>`).join('')+'</div>'}function render(){bracket();for(const c of ['A','B']){const m=event.courts[c];$(c).innerHTML=`<h2>${c}コート</h2>`+(m&&!m.winner?`<header><strong>${esc(m.label)}</strong><span class="timer" id="time${c}"></span></header><div class="grid">${m.teams.map((t,i)=>`<div class="team">${esc(t)}<div class="score">${m.scores[i]}</div>${m.turn===i?'投球順':''}</div>`).join('')}</div><button data-act="swap" ${m.start?'disabled':''}>先攻・後攻を入替</button><button data-act="start" ${m.start?'disabled':''}>開始</button><label>今回の得点</label><div>${Array.from({length:13},(_,i)=>`<button data-act="point" data-n="${i}" ${!m.start||remaining(m)===0?'disabled':''}>${i}</button>`).join('')}</div><button data-act="undo">1投戻す</button><button data-act="finish">勝者確定</button>`:`${m?`<p>${esc(m.label)}：${esc(m.winner)} 勝利</p>`:''}${next(c)===undefined?'<p>全試合終了</p>':`<h3>${esc(rounds[next(c)])}</h3><p>${card(next(c)).map(t=>esc(t||'未確定')).join(' 対 ')}</p><label>先攻チーム</label><select id="first${c}">${options(card(next(c)).filter(Boolean))}</select><button data-act="prepare" ${card(next(c)).every(Boolean)?'':'disabled'}>試合準備</button>`}`);$(c).onclick=safe(async ev=>{const b=ev.target.closest('button[data-act]');if(!b||busy)return;busy=true;try{const act=b.dataset.act;const form=act==='prepare'?[rounds[next(c)],$('first'+c).value,card(next(c)).find(t=>t!==$('first'+c).value)]:null;await load();const courts=structuredClone(event.courts);let m=courts[c];let history=[...event.history];if(act==='prepare'){if(form.some(x=>!x)||form[1]===form[2]||form[0]!==rounds[next(c)]||!card(next(c)).every(t=>form.slice(1).includes(t)))throw Error('試合と異なる2チームを選択');if(m&&!m.winner)throw Error('試合進行中');if(history.some(x=>x.label===form[0])||Object.values(courts).some(x=>x&&!x.winner&&x.label===form[0]))throw Error('同じ試合が登録済み');courts[c]={label:form[0],teams:form.slice(1),scores:[0,0],turn:0,start:null,undo:[]}}else{if(!m||m.winner)throw Error('試合終了済み');if(act==='swap'){if(m.start)throw Error('開始済み');m.teams.reverse()}if(act==='start'){if(m.start)throw Error('開始済み');m.start=Date.now()}if(act==='point'){if(!m.start||!remaining(m)||m.scores.includes(30))throw Error('得点受付終了');m.undo.push({scores:[...m.scores],turn:m.turn});const n=m.scores[m.turn]+Number(b.dataset.n);m.scores[m.turn]=n>30?15:n;m.turn=1-m.turn}if(act==='undo'){const u=m.undo.pop();if(u){m.scores=u.scores;m.turn=u.turn}}if(act==='finish'){if(!m.scores.includes(30)&&remaining(m)>0)throw Error('まだ試合時間内です');let i=m.scores[0]>m.scores[1]?0:1;if(m.scores[0]===m.scores[1]){const v=prompt('同点：サドンデス勝者を入力（1または2）');if(!['1','2'].includes(v))return;i=Number(v)-1}if(!confirm(m.teams[i]+' の勝利を確定しますか？'))return;m.winner=m.teams[i];history.push({...m,court:c})}}const final=history.find(x=>x.label==='決勝戦'),third=history.find(x=>x.label==='3位決定戦');const result=final&&third?[final.winner,final.teams.find(t=>t!==final.winner),third.winner]:[];await save({courts,history,result});render()}finally{busy=false}})}$('history').innerHTML=event.history.map(m=>`<p>${esc(m.label)}：${esc(m.teams.join(' 対 '))}　${m.scores.join(' - ')}　勝者 ${esc(m.winner)}</p>`).join('')}render();$('status').textContent='接続中';setInterval(()=>{for(const c of ['A','B']){const el=$('time'+c),m=event.courts[c];if(el&&m){el.textContent=fmt(remaining(m));if(m.start&&!remaining(m))$(c).querySelectorAll('[data-act=point]').forEach(b=>b.disabled=true)}}},250);setInterval(async()=>{if(busy)return;try{const v=event.version;await load();if(v!==event.version){const focused=document.activeElement;if(!focused?.matches("input,select,textarea"))render()}}catch(e){$('status').textContent=e.message}},5000)}}catch(e){$('status').textContent='初期化エラー: '+e.message;$('panel').hidden=true;$('login').hidden=false}</script></body></html>
