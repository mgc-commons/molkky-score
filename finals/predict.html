<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>順位予想</title><link rel="stylesheet" href="style.css"><body class=""><main><header><div><small>MÖLKKY DAYS / FINAL</small><h1>順位予想</h1></div><small id="status">接続確認中</small></header><section><h2>あなたの予想は？</h2><p>1位・2位・3位を選んでください。お一人につき1口です。</p><form id="form"><label>所属チーム名</label><select id="member" required></select><label>氏名（全角カタカナ）</label><input id="name" required maxlength="80" placeholder="ヤマダ タロウ" pattern="[ァ-ヺー・　 ]+"><div id="picks"></div><button class="primary" id="submit" disabled>予想を確定する</button></form><p id="message" role="status"></p></section><section><h2>的中判定</h2><p>三連単 → 三連複 → モル単 → モル連 → モル勝</p><p>最も上位の的中区分で判定します。</p><a href="final-display.html">決勝大会得点盤を見る</a></section></main><script type="module">import {db,$,watch,options,event} from './common.js';let signature='',memberSig='',busy=false;const key='mgc-final-device-v1',done='mgc-final-voted-v1';let device=localStorage.getItem(key);if(!device){device=crypto.randomUUID();localStorage.setItem(key,device)}watch(e=>{const s=JSON.stringify(e.teams);if(s!==signature){signature=s;$('picks').innerHTML=[1,2,3].map(i=>`<label class="rank">${i}位</label><select required id="p${i}">${options(e.teams)}</select>`).join('')} if(memberSig!==JSON.stringify(e.members)){memberSig=JSON.stringify(e.members);$('member').innerHTML=options(e.members)} $('form').hidden=!!localStorage.getItem(done);$('submit').disabled=busy||!e.voting||!!localStorage.getItem(done);$('message').textContent=localStorage.getItem(done)?'投票済みです':e.voting?'投票受付中':'投票受付時間外です'});$('form').onsubmit=async ev=>{ev.preventDefault();if(busy||localStorage.getItem(done))return;const picks=[1,2,3].map(i=>$('p'+i).value);if(new Set(picks).size!==3)return alert('異なる3チームを選択してください');if(!confirm(picks.map((t,i)=>`${i+1}位：${t}`).join('\n')+'\n確定しますか？'))return;busy=true;$('submit').disabled=true;const {error}=await db.rpc('final_vote',{p_device:device,p_team:$('member').value,p_name:$('name').value,p_picks:picks});busy=false;if(error){alert(error.code==='23505'?'この端末は投票済みです':error.message);$('submit').disabled=!event.voting}else{localStorage.setItem(done,'1');$('form').hidden=true;$('message').textContent='投票を受け付けました。';alert('投票完了')}};</script></body></html>
