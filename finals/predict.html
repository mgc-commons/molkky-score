<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>順位予想</title><link rel="stylesheet" href="style.css"><body class="prediction"><main><header><div><small>MÖLKKY FINAL / PREDICTION</small><h1>順位予想</h1></div><small id="status">接続確認中</small></header><section><h2>上位3チームを見極めよう</h2><p>1位・2位・3位を選んでください。お一人につき1口です。</p><form id="form"><label>所属チーム名</label><select id="member" required></select><label>氏名（全角カタカナ）</label><input id="name" required maxlength="80" placeholder="ヤマダ タロウ" pattern="[ァ-ヺー・　 ]+"><div id="picks"></div><button class="primary" id="submit" disabled>この予想でエントリー</button></form><p id="message" role="status"></p></section><section><a href="final-display.html">決勝大会得点盤を見る</a></section></main><script>window.addEventListener("error",e=>{document.getElementById("status").textContent="エラー: "+(e.message||"ファイル読込失敗")},true);window.addEventListener("unhandledrejection",e=>{document.getElementById("status").textContent="エラー: "+(e.reason?.message||e.reason)});</script><script type="module">import {db,$,watch,options,event} from './common.js?v=20261124reset1';let signature='',memberSig='',busy=false;const key='mgc-final-device-v1',done='mgc-final-voted-v1';let device=localStorage.getItem(key);if(!device){device=crypto.randomUUID();localStorage.setItem(key,device)}watch(e=>{const epoch=String(e.vote_epoch??0);if(localStorage.getItem('final-vote-epoch')!==epoch){localStorage.removeItem(done);localStorage.removeItem('final-seen-open');localStorage.setItem('final-vote-epoch',epoch)}if(e.voting)localStorage.setItem('final-seen-open','1');const s=JSON.stringify(e.teams);if(s!==signature){signature=s;$('picks').innerHTML=[1,2,3].map(i=>`<label class="rank"><span class="rank-number">${i}</span> ${i}位予想</label><select required id="p${i}">${options(e.teams)}</select>`).join('')} if(memberSig!==JSON.stringify(e.members)){memberSig=JSON.stringify(e.members);$('member').innerHTML=options(e.members)} $('form').hidden=!!localStorage.getItem(done);$('submit').disabled=busy||!e.voting||!!localStorage.getItem(done);$('message').textContent=localStorage.getItem(done)?'投票済みです':e.voting?'予想受付中 — 締切までにエントリー！':e.result.length?'順位確定 — 結果発表をお楽しみに':localStorage.getItem('final-seen-open')?'受付終了 — いよいよ勝負の行方はコートへ':'受付開始までお待ちください'});$('form').onsubmit=async ev=>{ev.preventDefault();if(busy||localStorage.getItem(done))return;const picks=[1,2,3].map(i=>$('p'+i).value);if(new Set(picks).size!==3)return alert('異なる3チームを選択してください');if(!confirm(picks.map((t,i)=>`${i+1}位：${t}`).join('\n')+'\n確定しますか？'))return;busy=true;$('submit').disabled=true;const submittedEpoch=String(event.vote_epoch??0);const {error}=await db.rpc('final_vote',{p_device:device,p_team:$('member').value,p_name:$('name').value,p_picks:picks});busy=false;if(error){alert(error.code==='23505'?'この端末は投票済みです':error.message);$('submit').disabled=!event.voting}else{if(localStorage.getItem('final-vote-epoch')!==submittedEpoch)return;localStorage.setItem(done,'1');$('form').hidden=true;$('message').textContent='投票を受け付けました。';alert('投票完了')}};</script></body></html>
