<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>順位予想</title><link rel="stylesheet" href="style.css"><style>[hidden]{display:none!important}</style><body class="prediction"><main><header><div><small>MÖLKKY FINAL / PREDICTION</small><h1>順位予想</h1></div><small id="status">接続確認中</small></header><section><h2>上位3チームを見極めよう</h2><p>1位・2位・3位を選んでください。お一人につき1口です。</p><form id="form" hidden><label>所属チーム名</label><select id="member" required></select><label>氏名（全角カタカナ）</label><input id="name" required maxlength="80" placeholder="ヤマダ タロウ" pattern="[ァ-ヺー・　 ]+"><div id="picks"></div><button class="primary" id="submit" disabled>この予想でエントリー</button></form><p id="message" role="status"></p></section><section><a href="final-display.html">決勝大会得点盤を見る</a></section></main><script>window.addEventListener("error",e=>{document.getElementById("status").textContent="エラー: "+(e.message||"ファイル読込失敗")},true);window.addEventListener("unhandledrejection",e=>{document.getElementById("status").textContent="エラー: "+(e.reason?.message||e.reason)});</script><script type="module">
import {db,$,options} from './common.js?v=relaunch3';
const key='mgc-final-device-v1';let device=localStorage.getItem(key);if(!device){device=crypto.randomUUID();localStorage.setItem(key,device)}
let state=null,busy=false,polling=false,signature='',memberSig='';
function render(e){state=e;const sig=JSON.stringify(e.teams);if(sig!==signature){signature=sig;$('picks').innerHTML=[1,2,3].map(i=>`<label class="rank"><span class="rank-number">${i}</span> ${i}位予想</label><select required id="p${i}">${options(e.teams)}</select>`).join('')}
if(memberSig!==JSON.stringify(e.members)){memberSig=JSON.stringify(e.members);$('member').innerHTML=options(e.members)}
$('form').hidden=e.voted||!e.voting;$('submit').disabled=busy||e.voted||!e.voting;$('message').textContent=e.voted?'投票済みです':e.voting?'予想受付中':e.result?.length?'順位確定':'受付開始までお待ちください';}
async function refresh(){if(polling||busy)return;polling=true;try{const {data,error}=await db.rpc('final_v3_status',{p_device:device});if(error||!data)throw Error(error?.message||'大会情報がありません');render(data);$('status').textContent='接続中・自動更新'}catch(e){state=null;$('form').hidden=true;$('message').textContent='接続エラー：'+e.message;$('status').textContent='再接続中'}finally{polling=false}}
$('form').onsubmit=async ev=>{ev.preventDefault();if(busy||!state?.voting||state.voted)return; if(polling){alert("通信確認中です。もう一度押してください");return;}const picks=[1,2,3].map(i=>$('p'+i).value);if(new Set(picks).size!==3)return alert('異なる3チームを選択してください');if(!confirm(picks.map((t,i)=>`${i+1}位：${t}`).join('\n')+'\n確定しますか？'))return;busy=true;$('submit').disabled=true;try{const {error}=await db.rpc('final_v3_submit',{p_device:device,p_team:$('member').value,p_name:$('name').value,p_picks:picks,p_epoch:state.epoch});if(error)alert(error.code==='23505'?'この端末は投票済みです':error.message);else alert('投票完了')}finally{busy=false;await refresh()}};
refresh();setInterval(refresh,2000);window.addEventListener('pageshow',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
