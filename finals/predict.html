<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>順位予想 | 本社モルック大会</title><style>
*{box-sizing:border-box} [hidden]{display:none!important}body{margin:0;background:#e9e9e9;color:#222;font:16px Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}main{max-width:600px;margin:auto;background:#fff;min-height:100vh;border-inline:1px solid #ccc}header{background:#087743;color:white;padding:13px 12px;border-bottom:3px solid #035b31}header small{font-size:12px}header h1{font-size:21px;margin:4px 0 0}#status{display:block;text-align:right;font-size:11px}h2{margin:0;background:linear-gradient(#4385bd,#205d99);color:white;font-size:17px;padding:9px 12px;border-bottom:1px solid #164a7e}.event{background:#f4f4f4;border-bottom:1px solid #b7b7b7;padding:10px 12px;font-weight:bold}.pad{padding:10px 12px}label{display:block;font-size:14px;font-weight:bold;margin:7px 0 4px}input,select{width:100%;font:inherit;padding:10px;border:1px solid #aaa;border-radius:3px;background:#fff;color:#222}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}th,td{border:1px solid #b6b6b6;padding:5px 3px;text-align:center}thead{background:#e0e8ef}thead th:first-child{width:43px}thead th:nth-child(n+3){width:51px}tbody th{text-align:left;overflow-wrap:anywhere;font-weight:normal}tbody tr:nth-child(even){background:#f3f3f3}.num{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border:1px solid #777;border-radius:2px;font-weight:bold;font-size:19px;font-family:Arial,sans-serif}.pick{width:100%;height:39px;border:1px solid #a1a1a1;border-radius:4px;background:linear-gradient(#fff,#dedede);color:#777;font-size:22px;cursor:pointer}.pick.selected{background:#087743;color:#fff;border-color:#00542c;font-weight:bold}.pick:disabled{opacity:.32;cursor:default}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1;min-height:47px;font: bold 16px Arial,Meiryo,sans-serif;border-radius:4px;border:1px solid #888;background:linear-gradient(#fff,#ddd);color:#333}#submit{background:linear-gradient(#17934e,#007137);color:white;border-color:#005c2d;flex:2}#submit:disabled{opacity:.45}#summary{border:1px solid #aaa;margin-top:9px;background:#f9f9f9}#summary div{display:flex;align-items:center;gap:8px;padding:5px 8px;min-height:37px;border-bottom:1px solid #ddd}#summary div:last-child{border:0}#summary b{width:38px;color:#285987}#message{padding:12px;text-align:center;font-weight:bold;background:#edf5ed;margin:0;border-bottom:1px solid #ccc}footer{padding:15px;text-align:center;font-size:13px}a{color:#215a92}p{margin:6px 0;font-size:13px}@media(max-width:360px){thead th:nth-child(n+3){width:43px}}

/* 即PAT風：表示のみ変更 */
body{background:#fff;color:#171717;font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}main{border:0;max-width:600px}header{background:linear-gradient(#81b66b 0%,#428c28 49%,#176900 51%,#176900 100%);border-bottom:1px solid #335b28;padding:6px 8px;text-align:center}header h1{font-size:20px;margin:2px 0;font-weight:700}header small{font-size:11px}#status{font-size:10px;text-align:center}h2{background:linear-gradient(#80b56a 0%,#438d29 49%,#176900 51%,#176900 100%);border-bottom:1px solid #375b29;padding:6px 8px;text-align:center;font-size:17px}.event{background:linear-gradient(#a0a7a2,#d2d6d3);color:#fff;text-shadow:0 1px #777;padding:5px 6px;font-size:14px;border-bottom:1px solid #666}#message{background:#fff;padding:8px;color:#176900}.pad{padding:8px 6px}#picks{margin:0 -6px}table{font-size:16px}th,td{border:0;border-bottom:1px solid #777;padding:5px 3px}thead{background:linear-gradient(#ddd,#f2f2f2);color:#666;font-size:13px}thead th:first-child{width:35px}thead th:nth-child(n+3){width:43px}thead th:nth-child(2){text-align:left;padding-left:4px}tbody th{font-size:16px;font-weight:700;color:#171717;text-align:left;line-height:1.3;padding-left:4px}tbody tr:nth-child(even){background:#fafafa}.num{width:25px;height:25px;border:1px solid #999;border-radius:0;font-size:15px}.pick{height:34px;border-radius:2px;font-size:19px}.pick.selected{background:linear-gradient(#509d34,#176900);border-color:#176900}#summary b{color:#176900}#submit{background:linear-gradient(#6eac52,#176900);border-color:#245d17}a{color:#176900}input,select{border-radius:2px}@media(max-width:360px){thead th:nth-child(n+3){width:37px}tbody th{font-size:15px}}
</style></head><body><main><header><small>MGC 本社モルック大会</small><h1>順位予想　ネット投票</h1><small id="status">接続確認中</small></header><div class="event">12月14日（月）　決勝大会</div><p id="message" role="status">接続確認中</p><form id="form" hidden><h2>参加者情報</h2><div class="pad"><label for="member">所属チーム名</label><select id="member" required></select><label for="name">氏名（全角カタカナ）</label><input id="name" required maxlength="80" placeholder="ヤマダ タロウ" pattern="[ァ-ヺー・　 ]+" autocomplete="name"></div><h2>チーム番号選択</h2><div class="pad"><p>1位・2位・3位の欄をそれぞれ選択してください。</p><div id="picks"></div></div><h2>投票内容</h2><div class="pad"><div id="summary"></div><div class="actions"><button type="button" id="clear">クリア</button><button type="submit" id="submit" disabled>投票内容確認</button></div><p>投票はお一人につき1口です。</p></div></form><footer><a href="final-display.html">決勝大会得点盤を見る</a></footer></main><script>window.addEventListener("error",e=>{document.getElementById("status").textContent="エラー: "+(e.message||"ファイル読込失敗")},true);window.addEventListener("unhandledrejection",e=>{document.getElementById("status").textContent="エラー: "+(e.reason?.message||e.reason)});</script><script type="module">
import {db,$,options,esc} from './common.js?v=relaunch3';
const key='mgc-final-device-v1';let device=localStorage.getItem(key);if(!device){device=crypto.randomUUID();localStorage.setItem(key,device)}
let state=null,busy=false,polling=false,signature='',memberSig='', picksSelected=['','',''];
const colors=['#ffffff','#000000','#ff0000','#0000ff','#ffff00','#008000','#ff9900','#f2a0f5'];
function number(i){return `<span class="num" style="background:${colors[i]||'#ddd'};color:${[0,4,6,7].includes(i)?'#111':'#fff'}">${i+1}</span>`}
function drawGrid(teams){picksSelected=['','',''];$('picks').innerHTML=`<table><thead><tr><th>番号</th><th>チーム名</th><th>1位</th><th>2位</th><th>3位</th></tr></thead><tbody>${teams.map((t,i)=>`<tr><td>${number(i)}</td><th scope="row">${esc(t)}</th>${[0,1,2].map(r=>`<td><button type="button" class="pick" data-i="${i}" data-r="${r}" aria-label="${esc(t)} ${r+1}位" aria-pressed="false">○</button></td>`).join('')}</tr>`).join('')}</tbody></table>`;paint()}
function paint(){const teams=state?.teams||[];document.querySelectorAll('.pick').forEach(b=>{const t=teams[+b.dataset.i],r=+b.dataset.r,selected=picksSelected[r]===t;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));b.textContent=selected?'✓':'○';b.disabled=picksSelected.some((v,j)=>j!==r&&v===t)});$('summary').innerHTML=picksSelected.map((t,i)=>`<div><b>${i+1}位</b>${t?number(teams.indexOf(t))+' '+esc(t):'－'}</div>`).join('');$('submit').disabled=busy||!state?.voting||state?.voted||picksSelected.some(t=>!t)}
$('picks').onclick=e=>{const b=e.target.closest('.pick');if(!b||b.disabled||busy||!state?.voting||state.voted)return;const r=+b.dataset.r,t=state.teams[+b.dataset.i];picksSelected[r]=picksSelected[r]===t?'':t;paint()};$('clear').onclick=()=>{if(!busy){picksSelected=['','',''];paint()}};

function render(e){const changed=state&&state.epoch!==e.epoch;state=e;if(changed){picksSelected=['','',''];}const sig=JSON.stringify(e.teams);if(sig!==signature){signature=sig;drawGrid(e.teams)}
if(memberSig!==JSON.stringify(e.members)){memberSig=JSON.stringify(e.members);$('member').innerHTML=options(e.members)}
$('form').hidden=e.voted||!e.voting;paint();$('message').textContent=e.voted?'投票済みです':e.voting?'予想受付中':e.result?.length?'順位確定':'受付開始までお待ちください';}
async function refresh(){if(polling||busy)return;polling=true;try{const {data,error}=await db.rpc('final_v3_status',{p_device:device});if(error||!data)throw Error(error?.message||'大会情報がありません');render(data);$('status').textContent='接続中・自動更新'}catch(e){state=null;$('form').hidden=true;$('message').textContent='接続エラー：'+e.message;$('status').textContent='再接続中'}finally{polling=false}}
$('form').onsubmit=async ev=>{ev.preventDefault();if(busy||!state?.voting||state.voted)return; if(polling){alert("通信確認中です。もう一度押してください");return;}const picks=[...picksSelected];if(picks.some(t=>!t)||new Set(picks).size!==3)return alert('異なる3チームを選択してください');if(!confirm(picks.map((t,i)=>`${i+1}位：${t}`).join('\n')+'\n確定しますか？'))return;busy=true;$('submit').disabled=true;try{const {error}=await db.rpc('final_v3_submit',{p_device:device,p_team:$('member').value,p_name:$('name').value,p_picks:picks,p_epoch:state.epoch});if(error)alert(error.code==='23505'?'この端末は投票済みです':error.message);else alert('投票完了')}finally{busy=false;await refresh()}};
refresh();setInterval(refresh,2000);window.addEventListener('pageshow',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
