<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MÖLKKY DAYS | リーグ戦スコア</title><style>
:root{--ink:#304e49;--muted:#71847e;--green:#487e70;--mint:#dceee7;--pink:#ffe7e4;--cream:#fff9f0;--line:#e3eae5;--purple:#ede6f7}*{box-sizing:border-box}body{margin:0;background:#f9f7f3;color:var(--ink);font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif}button,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:1160px;margin:auto;padding:20px 18px 70px}.hero{border-radius:28px;background:linear-gradient(115deg,#e0f0e6 0%,#f8ede9 55%,#f1e9f9 100%);padding:30px 30px 24px;position:relative;overflow:hidden}.eyebrow{font-size:12px;letter-spacing:.18em;font-weight:900;color:#648a7b}.hero h1{font-size:clamp(30px,6vw,52px);margin:8px 0 3px;letter-spacing:.03em;position:relative;z-index:1}.hero p{margin:0;color:#617e74;position:relative;z-index:1}.badge{display:inline-block;background:white;border-radius:30px;padding:7px 13px;font-size:12px;font-weight:800;margin-top:15px;position:relative;z-index:1}.panel{background:white;border:1px solid #edf0eb;border-radius:24px;padding:23px;margin-top:18px;box-shadow:0 9px 30px #3c5c4810}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.heading h2{margin:0;font-size:20px}.sub{color:var(--muted);font-size:13px}.league-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.league{border:2px solid transparent;background:#f7f8f5;border-radius:17px;text-align:left;padding:15px 12px;color:var(--ink);transition:.15s;min-height:112px}.league:hover{transform:translateY(-2px);background:#f1f7f1}.league.selected{border-color:#75b09b;background:#e9f5ed}.league .letter{font-weight:900;font-size:26px;line-height:1}.league .date{font-size:13px;color:#6a8176;margin-top:7px}.league .result{font-size:12px;margin-top:8px;font-weight:800;color:#48846d;min-height:16px}.flow{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.step{flex:1;min-width:100px;border:1px solid #e5eae4;background:#fff;border-radius:15px;padding:12px;text-align:left;color:var(--ink)}.step.active{border:2px solid #80ae9a;background:#eaf6ed}.step.done{background:#f5f0fb}.step b{display:block;font-size:14px}.step small{font-size:11px;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;background:#4b8976;color:white;padding:12px 18px;border-radius:13px;font-weight:900}.btn.light{background:#edf4ee;color:#386d5c}.btn.rose{background:#fbe9e8;color:#9b6260}.btn.outline{background:white;border:1px solid #dce6df;color:#537668}.board-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.board-head h2{font-size:24px;margin:5px 0}.scores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:20px 0}.team{border:2px solid #e7ece6;border-radius:22px;padding:17px;background:#fffdfa;position:relative;overflow:hidden}.team:nth-child(2){background:#fff9f8}.team:nth-child(3){background:#f7fbf8}.team:nth-child(4){background:#faf8ff}.team.won{border-color:#edb8a6;background:#fff4eb}.team h3{font-size:clamp(15px,2.4vw,21px);margin:0;min-height:34px;line-height:1.45}.scoreline{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:4px 0 12px}.score{font-size:clamp(62px,10vw,100px);font-weight:900;line-height:1;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.outof{color:#9ca9a0;font-size:15px;font-weight:800}.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.point{border:1px solid #d9e9df;background:#e7f4ea;color:#376b59;border-radius:12px;min-height:48px;font-size:19px;font-weight:900}.point:active{transform:scale(.95);background:#c8e7d3}.point.zero{grid-column:span 4;background:#f5f1ed;color:#867b73;border-color:#eee9e2;font-size:14px}.minor{border:0;background:transparent;text-decoration:underline;color:#74877e;padding:10px 0;font-size:12px}.status{border-radius:15px;background:#f1f8f3;padding:13px 15px;font-size:14px;margin-top:15px}.winner{background:linear-gradient(100deg,#ff .modal{position:fixed;inset:0;background:#263b3678;display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;backdrop-filter:blur(5px)}.modal-card{background:linear-gradient(145deg,#fffefb,#f0f8f2);border:1px solid #d7e8df;box-shadow:0 24px 70px #253f3450;border-radius:26px;padding:34px 26px;width:min(100%,440px);text-align:center}.modal-card h2{font-size:34px;margin:12px 0}.modal-question{font-weight:700;color:#627e72}.modal-team{font-size:clamp(22px,5vw,30px);font-weight:900;color:#2f6857;background:#e3f2e9;border-radius:18px;padding:22px 14px;margin:18px 0;overflow-wrap:anywhere}.modal-actions{display:flex;flex-direction:column;gap:9px;margin-top:22px}.modal-actions button{min-height:50px}.team.reached{border-color:#78aa94;box-shadow:0 0 0 3px #d6ebde}.reached-label{display:inline-block;background:#dcefe2;color:#376e59;padding:4px 9px;border-radius:99px;font-size:12px;font-weight:900;margin-top:6px}@media(max-width:650px){.modal-card{padding:27px 18px}} .advance{margin:18px 0;padding:20px;border:1px solid #d5e8db;border-radius:22px;background:linear-gradient(110deg,#e5f4eb,#f9eee8);text-align:center}.advance h3{margin:4px 0 7px;font-size:clamp(21px,4vw,29px)}.advance p{color:#617a70;margin:6px 0 16px}.advance .btn{font-size:17px;min-height:56px;padding:13px 23px}.advance .back{background:transparent;border:0;color:#658378;text-decoration:underline;margin-top:8px}.advance.final{background:linear-gradient(120deg,#e1f1e7,#f6edf4,#fff4e9);border-color:#bddcc8}.advance.final h3{color:#34715c}.advance .qualified{font-weight:900;font-size:clamp(21px,4vw,31px);margin:14px 0;color:#356d5a;overflow-wrap:anywhere}.advance .mini{font-size:12px} </style></head><body><main class="shell"><header class="hero"><div class="eyebrow">MGC COMMONS · TEAM PLAY</div><h1>MÖLKKY DAYS </h1><p>みんなで投げて、笑って、勝ち抜こう。</p><div class="badge" id="sync">この端末に保存中</div></header>
<section class="panel" id="homePanel"><div class="heading"><div><h2>記録するリーグを選択</h2></div></div><div class="league-grid" id="leagues"></div></section>
<section class="panel hidden" id="leaguePanel"><div class="heading"><div><h2 id="leagueTitle">Cリーグ</h2><div class="sub" id="leagueDate"></div></div><span class="tag" id="leagueStatus">開催予定</span></div><div class="flow hidden" id="rounds"></div><div class="status hidden" id="roundHint"></div><div class="row" style="margin-top:14px"><button class="btn" id="openRound">第1試合を始める</button><button class="btn light" id="homeFromLeague">ホームに戻る</button><button class="btn light hidden" id="newRound">新しく記録を作る ＋</button></div><div class="tiny" id="teamPreview"></div></section>
<section class="panel hidden" id="board"><div class="board-head"><div><div class="eyebrow" id="boardMeta"></div><h2 id="boardTitle"></h2></div><div class="actions"><button class="btn outline" id="homeFromBoard">ホームに戻る</button><button class="btn light" id="undo">↶ 1投戻す</button><button class="btn outline" id="share">共有リンク</button></div></div><div class="status" id="notice"></div><div class="scores" id="scores"></div><div id="winnerBanner" class="winner hidden"></div><div id="advance" class="advance hidden"></div><div class="divider"></div><div class="heading"><h2>試合結果を確定</h2></div><div class="sub">30点に到達すると自動的に勝者確認画面が開きます。得点の修正や確定解除も可能です。</div><div class="row" style="margin-top:12px"><button class="btn light" id="reviewWinner">30点到達チームを確認</button><button class="btn rose" id="clearWinner">確定を解除</button></div><details style="margin-top:20px"><summary class="sub" style="cursor:pointer;font-weight:800">得点履歴・管理メニュー</summary><div id="history"></div><div class="row" style="margin-top:12px"><button class="btn rose" id="reset">この試合をリセット</button></div></details></section>
<section class="panel hidden" id="recordsPanel"><div class="heading"><div><h2>みんなの試合記録</h2><div class="sub">作成した試合がここに並びます。</div></div><button class="btn outline" id="export">CSV出力</button></div><div class="list" id="matchList"></div></section><footer>30点ぴったりで勝利 ・ 30点を超えたら15点に戻る ・ ミスは0点</footer></main>
<div id="winnerModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-card"><div class="eyebrow">30 POINTS · MATCH POINT</div><h2 id="modalTitle">30点達成！</h2><p class="modal-question">このチームを勝者として確定しますか？</p><div class="modal-team" id="modalTeam"></div><p class="sub">修正したい場合は「得点を修正」を選んでください。</p><div class="modal-actions"><button class="btn" id="modalConfirm">このチームで確定</button><button class="btn light" id="modalEdit">得点を修正</button></div></div></div><script type="module">
const firebaseConfig=null; // FirebaseコンソールのWebアプリ設定オブジェクトを貼り付けてください
const leagueTeams={A:['KENTOBU-H','経理グループ選抜','ラーニングサークル同窓会','team アミン'],B:['HPP①','逆スライダー','筋トレ部B','モルラボ'],C:['原田JAPAN','チーム26卒','情シス','2001'],D:['おでんにちくわぶ忘れないで','宮司さんと仲間たち','男子材料事業部','モルック組合'],E:['HPP②','優勝候補','KENTOBU-K','モフコーンS'],F:['KENTOBU-T','ZA!MU','筋トレ部A','チエの輪'],G:['LHS','おおまさり','さいさりす','名刺交換からお願いします'],H:['僕らのプラネット','MMOBTS','よっこら会']};
const dates={A:'2026-12-03',B:'2026-12-02',C:'2026-11-16',D:'2026-11-19',E:'2026-11-25',F:'2026-12-04',G:'2026-11-11',H:'2026-12-01'};

let matches=[],db=null,remote=false,selected='C',round=1,current=null,pendingWinner=null,view='home',showHomeRecords=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2);const dateLabel=d=>{let [y,m,day]=d.split('-');return `${+m}/${+day}`};const get=(l,r)=>matches.filter(m=>m.league===l&&m.round===r).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))[0];const selectedMatch=()=>matches.find(m=>m.id===current);
function standings(l,r){let prev=get(l,r-1),all=leagueTeams[l];if(r===1)return {teams:all,ready:true};if(!prev||prev.winner==null)return {teams:[],ready:false};let loser=prev.teams.filter((_,i)=>i!==prev.winner);if(r===2||r===3)return {teams:loser,ready:true};let wins=[1,2,3].map(k=>get(l,k));if(wins.some(m=>!m||m.winner==null))return {teams:[],ready:false};return {teams:wins.map(m=>m.teams[m.winner]),ready:true}}
function persist(){if(!remote)localStorage.setItem('molkky_matches_v3',JSON.stringify(matches));render()}
async function put(m){if(remote){const {doc,setDoc}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');await setDoc(doc(db,'matches',m.id),m)}else{let i=matches.findIndex(x=>x.id===m.id);if(i<0)matches.push(m);else matches[i]=structuredClone(m);persist()}render()}
function render(){renderLeagues();renderLeague();renderList();renderBoard();renderView();if(pendingWinner){let m=selectedMatch();if(!m||m.id!==pendingWinner.id||m.winner!=null||m.scores[pendingWinner.index]!==30)closeWinnerModal()}}
function renderView(){ $('homePanel').classList.toggle('hidden',view!=='home');$('leaguePanel').classList.toggle('hidden',view!=='league');$('board').classList.toggle('hidden',view!=='board'||!selectedMatch());$('recordsPanel').classList.toggle('hidden',view!=='home'||!showHomeRecords); }
function goHome(){view='home';current=null;showHomeRecords=true;render();window.scrollTo({top:0,behavior:'smooth'})}
function renderLeagues(){$('leagues').innerHTML=Object.keys(leagueTeams).map(l=>{let final=get(l,4),done=final?.winner!=null;return `<button class="league ${selected===l?'selected':''}" data-l="${l}"><div class="letter">${l}<span style="font-size:13px"> group</span></div><div class="date">${dateLabel(dates[l])} 開催</div><div class="result">${done?'代表：'+esc(final.teams[final.winner]):'確定 '+matches.filter(m=>m.league===l&&m.winner!=null).length+'/4 試合確定'}</div></button>`}).join('');document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{selected=b.dataset.l;round=1;current=null;view='league';render();window.scrollTo({top:0,behavior:'smooth'})})}
function renderLeague(){$('leagueTitle').textContent=selected+'リーグ';$('leagueDate').textContent=dates[selected].replaceAll('-','/')+' 開催 · '+leagueTeams[selected].length+'チーム';let fin=get(selected,4);$('leagueStatus').textContent=fin?.winner!=null?'代表決定':'進行中 / 開催予定';$('rounds').innerHTML=[1,2,3,4].map(r=>`<button class="step ${round===r?'active':''} ${get(selected,r)?.winner!=null?'done':''}" data-r="${r}"><b>第${r}試合 ${get(selected,r)?.winner!=null?'✓':''}</b><small>${(selected==='H'?[3,2,1,3]:[4,3,2,3])[r-1]}チーム対戦</small></button>`).join('');document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{round=+b.dataset.r;current=get(selected,round)?.id||null;render()});let info=standings(selected,round),existing=get(selected,round);$('roundHint').innerHTML=existing?.winner!=null?`勝利：<b>${esc(existing.teams[existing.winner])}</b>`:round===1?'最初は全チームでスタート。1位が最終戦へ進みます。':round===4?'3チームの勝者がリーグ代表に。':round===2?'第1試合の残り3チームが対戦します。':'第2試合の残り2チームが対戦します。';$('teamPreview').textContent='参加チーム：'+leagueTeams[selected].join(' ／ ');$('openRound').disabled=!existing&&!info.ready;$('openRound').textContent=existing?'第1試合の記録を開く':'第1試合を始める';$('newRound').disabled=!info.ready;$('newRound').textContent=existing?'同じ試合を新規作成 ＋':'新しく記録を作る ＋'}
async function create(force=false){let info=standings(selected,round);if(!info.ready){alert('前の試合の勝者を確定してください');return}let existing=get(selected,round);if(existing&&!force){current=existing.id;view='board';render();window.scrollTo({top:0,behavior:'smooth'});return}if(existing&&force&&!confirm('同じリーグ・試合番号の記録を追加しますか？通常は既存の記録を開いてください。'))return;let m={id:uid(),date:dates[selected],league:selected,round,teams:info.teams,scores:info.teams.map(()=>0),winner:null,events:[],createdAt:new Date().toISOString()};current=m.id;view='board';await put(m);window.scrollTo({top:0,behavior:'smooth'})}
function renderBoard(){let m=selectedMatch();$('board').classList.toggle('hidden',!m);if(!m)return;$('boardMeta').textContent=`${m.league} GROUP · ${dateLabel(m.date)} · ${m.teams.length} TEAMS`;$('boardTitle').textContent=m.round===4?'リーグ決勝戦 · SCORE BOARD':`第${m.round}試合 · SCORE BOARD`;$('notice').textContent=m.winner!=null?'勝者確定済み。修正する場合は確定を解除してください。':'倒れたスキットルの得点をタップ。30点ぴったりを目指そう。';$('scores').innerHTML=m.teams.map((t,i)=>`<article class="team ${m.winner===i?'won':''} ${m.scores[i]===30?'reached':''}"><h3>${esc(t)}</h3>${m.scores[i]===30?'<span class="reached-label">30点達成</span>':''}<div class="scoreline"><div class="score">${m.scores[i]}</div><span class="outof">/ 30</span></div><div class="pad">${Array.from({length:12},(_,j)=>`<button class="point" data-team="${i}" data-points="${j+1}" ${m.winner!=null?'disabled':''}>${j+1}</button>`).join('')}<button class="point zero" data-team="${i}" data-points="0" ${m.winner!=null?'disabled':''}>0点 · ミス</button></div><button class="minor" data-edit="${i}">得点を修正する</button></article>`).join('');document.querySelectorAll('[data-points]').forEach(b=>b.onclick=()=>add(+b.dataset.team,+b.dataset.points));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{if(m.winner!=null){alert('勝者確定を解除してから修正してください');return}let i=+b.dataset.edit,n=prompt(m.teams[i]+' の得点を入力（0～30）',m.scores[i]);if(n===null)return;n=Number(n);if(!Number.isInteger(n)||n<0||n>30)return alert('0～30の整数を入力してください');update(m,i,n,'手動修正')});$('reviewWinner').disabled=m.winner!=null||!m.scores.includes(30);$('clearWinner').disabled=m.winner==null;$('winnerBanner').classList.toggle('hidden',m.winner==null);$('winnerBanner').textContent=m.winner==null?'':'WINNER · '+m.teams[m.winner];renderAdvance(m);$('history').innerHTML=(m.events||[]).slice().reverse().map(e=>`<div class="log">${esc(e.at)} · ${esc(e.team)} · ${esc(e.label)}（${e.before} → ${e.after}）</div>`).join('')||'<p class="sub">まだ記録がありません。</p>';$('undo').disabled=!(m.events||[]).length||m.winner!=null}
function renderAdvance(m){
 const el=$('advance');el.classList.toggle('hidden',m.winner==null);if(m.winner==null){el.innerHTML='';return}
 const name=esc(m.teams[m.winner]);
 if(m.round===4){el.classList.add('final');el.innerHTML=`<div class="eyebrow">LEAGUE CHAMPION</div><h3>決勝リーグ進出！ おめでとうございます</h3><div class="qualified">${name}</div><p>${m.league}リーグの代表チームに決定しました。</p><button class="btn light" id="backToLeague">リーグ一覧へ戻る</button>`;}
 else{el.classList.remove('final');let next=m.round+1;let count=next===2?m.teams.length-1:next===3?m.teams.length-1:3;el.innerHTML=`<div class="eyebrow">ROUND ${m.round} COMPLETE</div><h3>${name} が勝利！</h3><p>${next===4?'次はいよいよリーグ決勝戦。これまでの勝者3チームが対戦します。':`次は第${next}試合。残った${count}チームが対戦します。`}</p><button class="btn" id="goNext">${next===4?'リーグ決勝戦（第4試合）へ進む':`第${next}試合へ進む`}</button><div><button class="back" id="stayHere">この試合に戻る・結果を修正する</button></div>`;}
 const go=$('goNext');if(go)go.onclick=async()=>{selected=m.league;round=m.round+1;current=null;await create(false);};
 const back=$('backToLeague');if(back)back.onclick=goHome;
 const stay=$('stayHere');if(stay)stay.onclick=()=>{$('clearWinner').scrollIntoView({behavior:'smooth',block:'center'});};
}
function renderList(){let sorted=[...matches].sort((a,b)=>a.date.localeCompare(b.date)||a.league.localeCompare(b.league)||a.round-b.round);$('matchList').innerHTML=sorted.length?sorted.map(m=>`<button class="record" data-id="${esc(m.id)}"><span>${dateLabel(m.date)} · ${m.league}リーグ</span><b>第${m.round}試合 · ${m.teams.length}チーム</b><span>${m.winner==null?'記録中':'勝利：'+esc(m.teams[m.winner])}</span></button>`).join(''):'<div class="empty">まだ記録はありません。リーグを選んで始めましょう。</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{let m=matches.find(x=>x.id===b.dataset.id);selected=m.league;round=m.round;current=m.id;view='board';render();window.scrollTo({top:0,behavior:'smooth'})})}
function closeWinnerModal(){pendingWinner=null;$('winnerModal').classList.add('hidden')}
function showWinnerModal(m,i){if(m.winner!=null||m.scores[i]!==30)return;pendingWinner={id:m.id,index:i};$('modalTeam').textContent=m.teams[i];$('winnerModal').classList.remove('hidden');$('modalConfirm').focus()}
function update(m,i,n,label){let before=m.scores[i];m.scores[i]=n;m.events.push({index:i,team:m.teams[i],before,after:n,label,at:new Date().toLocaleTimeString('ja-JP')});put(m);if(n===30&&before!==30&&m.winner==null)showWinnerModal(m,i)}function add(i,p){let m=selectedMatch();if(!m||m.winner!=null)return;let sum=m.scores[i]+p;update(m,i,sum>30?15:sum,`${p}点${sum>30?' · 15点に戻る':''}`)}
$('modalConfirm').onclick=async()=>{if(!pendingWinner)return;let {id,index}=pendingWinner,m=matches.find(x=>x.id===id);if(!m||m.winner!=null||m.scores[index]!==30){closeWinnerModal();return alert('得点が変更されています。もう一度確認してください。')}m.winner=index;closeWinnerModal();await put(m);$('advance').scrollIntoView({behavior:'smooth',block:'center'})};
$('modalEdit').onclick=()=>{if(!pendingWinner)return;let {id,index}=pendingWinner,m=matches.find(x=>x.id===id);closeWinnerModal();if(!m)return;let raw=prompt(m.teams[index]+' の正しい得点を入力（0～30）',m.scores[index]);if(raw===null)return;let n=Number(raw);if(!Number.isInteger(n)||n<0||n>30)return alert('0～30の整数を入力してください');update(m,index,n,'手動修正')};
$('reviewWinner').onclick=()=>{let m=selectedMatch();if(!m||m.winner!=null)return;let i=m.scores.indexOf(30);if(i>=0)showWinnerModal(m,i)};
$('openRound').onclick=()=>{round=1;create(false)};$('homeFromLeague').onclick=goHome;$('homeFromBoard').onclick=goHome;$('newRound').onclick=()=>create(true);$('undo').onclick=()=>{let m=selectedMatch();if(!m?.events?.length||m.winner!=null)return;let e=m.events.pop();m.scores[e.index]=e.before;put(m)};$('clearWinner').onclick=()=>{let m=selectedMatch();if(!m||m.winner==null)return;if(!confirm('勝者確定を解除しますか？'))return;m.winner=null;put(m)};$('reset').onclick=()=>{let m=selectedMatch();if(!m||!confirm('この試合の得点と履歴を消去しますか？'))return;m.scores=m.scores.map(()=>0);m.events=[];m.winner=null;put(m)};$('share').onclick=async()=>{let url=location.href.split('?')[0]+'?match='+encodeURIComponent(current);try{await navigator.clipboard.writeText(url);alert('リンクをコピーしました')}catch{prompt('URLをコピーしてください',url)}};$('export').onclick=()=>{let rows=[['日付','リーグ','試合','チーム','得点','勝者','試合ID']];matches.forEach(m=>m.teams.forEach((t,i)=>rows.push([m.date,m.league,m.round,t,m.scores[i],m.winner===i?'勝利':'',m.id])));let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='molkky_results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
async function init(){if(firebaseConfig?.apiKey&&firebaseConfig?.projectId){try{let [{initializeApp},{getFirestore,collection,onSnapshot}]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js')]);db=getFirestore(initializeApp(firebaseConfig));remote=true;$('sync').textContent='リアルタイム同期中';onSnapshot(collection(db,'matches'),snap=>{matches=snap.docs.map(d=>d.data());render();let id=new URLSearchParams(location.search).get('match');if(id&&!current&&matches.some(m=>m.id===id)){current=id;let m=selectedMatch();selected=m.league;round=m.round;view='board';render()}},e=>{$('sync').textContent='Firebase接続エラー';console.error(e)})}catch(e){remote=false;console.error(e);$('sync').textContent='Firebase接続失敗 · この端末に保存'}}if(!remote){try{matches=JSON.parse(localStorage.getItem('molkky_matches_v3')||'[]')}catch{matches=[]}let id=new URLSearchParams(location.search).get('match');if(id&&matches.some(m=>m.id===id)){current=id;let m=selectedMatch();selected=m.league;round=m.round;view='board'}render()}}init();
</script></body></html>
