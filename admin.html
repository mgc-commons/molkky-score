<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MÖLKKY DAYS | 運営管理</title><style>
:root{--ink:#304e49;--muted:#71847e;--green:#487e70}*{box-sizing:border-box}body{margin:0;background:#f9f7f3;color:var(--ink);font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif}.shell{max-width:1000px;margin:auto;padding:20px 18px 60px}.hero{background:linear-gradient(115deg,#e0f0e6,#f8ede9 55%,#f1e9f9);border-radius:28px;padding:28px}.hero h1{margin:6px 0}.eyebrow{font-size:12px;letter-spacing:.17em;font-weight:900;color:#648a7b}.panel{background:white;border:1px solid #edf0eb;border-radius:23px;padding:22px;margin-top:18px;box-shadow:0 9px 30px #3c5c4810}.sub{color:var(--muted);font-size:13px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.league{border:1px solid #e2ece5;border-radius:18px;background:#fffdfa;padding:17px}.league:nth-child(4n+2){background:#fff8f7}.league:nth-child(4n+3){background:#f7fbf8}.league:nth-child(4n+4){background:#faf8ff}h2{margin:0 0 10px;font-size:20px}h3{margin:0 0 10px}label{display:block;font-size:12px;color:#667e72;font-weight:800;margin:10px 0 5px}input,select{font:inherit;padding:10px;border:1px solid #d8e5dc;border-radius:11px;background:white;color:var(--ink);width:100%}button{font:inherit;cursor:pointer;background:#4b8976;border:0;border-radius:12px;color:white;padding:11px 16px;font-weight:800}button.light{background:#e9f3ed;color:#386d5c}button.rose{background:#fbe9e8;color:#9b6260}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none!important}.tag{background:#e5f1e9;border-radius:30px;padding:5px 9px;font-size:11px;font-weight:800}.teams{font-size:12px;line-height:1.7;color:#668078;min-height:50px}.switch{display:flex;align-items:center;gap:7px;font-weight:800}.switch input{width:auto}#message{font-size:13px;color:#a15e5b;white-space:pre-wrap}.box{max-width:460px}a{color:#3c806a}@media(max-width:700px){.grid{grid-template-columns:1fr}.panel{padding:16px}}
</style></head><body><main class="shell"><header class="hero"><div class="eyebrow">MGC COMMONS · STAFF ONLY</div><h1>MÖLKKY 管理画面</h1><p>リーグの入力制限とチームの入れ替え</p></header>
<section class="panel" id="loginPanel"><h2>運営ログイン</h2><p class="sub">共通パスワードのみでログインできます。パスワードはブラウザ内で一時保持し、再読み込み時に消去されます。</p><div class="box"><label>共通パスワード</label><input id="password" type="password" autocomplete="current-password"><p><button id="login">ログイン</button></p></div></section>
<div id="adminPanel" class="hidden"><section class="panel"><div class="row"><div><h2>リーグ別の入力設定</h2><div class="sub">開始・終了日時は日本時間で入力。空欄なら日時制限なし。入力OFFなら即時ロックします。</div></div><div style="text-align:right"><button class="light" id="logout">ログアウト</button></div></div><div class="grid" id="leagues"></div></section>
<section class="panel"><h2>チームの入れ替え</h2><p class="sub">リーグ間で1チームずつ交換します。交換先・交換元の両リーグで試合が開始されている場合は変更できません。人数はA～Gが4チーム、Hが3チームのまま維持されます。</p><div class="grid"><div><label>交換元リーグ</label><select id="fromLeague"></select><label>交換するチーム</label><select id="fromTeam"></select></div><div><label>交換先リーグ</label><select id="toLeague"></select><label>交換するチーム</label><select id="toTeam"></select></div></div><p><button id="swap">2チームを交換する</button></p></section></div><section class="panel"><p id="message" role="status">接続準備中…</p><a href="./index.html">得点登録ページに戻る</a></section></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://lejycjqmigukhdppbdbe.supabase.co','sb_publishable_uTkkThPaCAKf_bQJWF5pig_dWGvMwcZ');
const $=id=>document.getElementById(id);let leagues=[];let adminPassword=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=s=>$('message').textContent=s;const dt=s=>s?new Date(s).toLocaleString('sv-SE',{timeZone:'Asia/Tokyo'}).slice(0,16).replace(' ','T'):'';
const utc=s=>s?new Date(s+'+09:00').toISOString():null;
async function check(){
  const logged=!!adminPassword;
  $('loginPanel').classList.toggle('hidden',logged);
  $('adminPanel').classList.toggle('hidden',!logged);
  if(logged)await refresh();else msg('共通パスワードを入力してください');
}
async function refresh(){const {data,error}=await supabase.from('molkky_leagues').select('*').order('league');if(error){msg(error.message);return}leagues=data||[];render();msg('設定を読み込みました')}
function render(){const oldFrom=$('fromLeague').value,oldTo=$('toLeague').value;$('leagues').innerHTML=leagues.map(l=>`<div class="league"><div class="row"><h3>LEAGUE ${l.league}</h3><span class="tag">${l.teams.length} TEAMS</span></div><div class="teams">${l.teams.map(esc).join(' ／ ')}</div><label class="switch"><input type="checkbox" id="on${l.league}" ${l.enabled?'checked':''}>入力を許可する</label><label>入力開始（日本時間）</label><input type="datetime-local" id="start${l.league}" value="${dt(l.open_at)}"><label>入力終了（日本時間）</label><input type="datetime-local" id="end${l.league}" value="${dt(l.close_at)}"><p><button class="light" data-save="${l.league}">このリーグの設定を保存</button></p></div>`).join('');document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save));for(const id of ['fromLeague','toLeague'])$(id).innerHTML=leagues.map(l=>`<option value="${l.league}">${l.league}リーグ</option>`).join('');$('fromLeague').value=oldFrom||'D';$('toLeague').value=oldTo||'E';renderTeams()}
function renderTeams(){for(const [leagueId,teamId] of [['fromLeague','fromTeam'],['toLeague','toTeam']]){const l=leagues.find(x=>x.league===$(leagueId).value);$(teamId).innerHTML=(l?.teams||[]).map((t,i)=>`<option value="${i}">${esc(t)}</option>`).join('')}}
$('fromLeague').onchange=renderTeams;$('toLeague').onchange=renderTeams;
async function save(l){const enabled=$('on'+l).checked,open_at=utc($('start'+l).value),close_at=utc($('end'+l).value);if(open_at&&close_at&&open_at>close_at){msg('終了日時は開始日時より後にしてください');return}if(!confirm(l+'リーグの入力設定を変更しますか？'))return;const {error}=await supabase.rpc('molkky_admin_set_league',{p_league:l,p_enabled:enabled,p_open_at:open_at,p_close_at:close_at,p_password:adminPassword});if(error){msg('保存失敗：'+error.message);return}await refresh();msg(l+'リーグの設定を保存しました')}
$('swap').onclick=async()=>{const a=$('fromLeague').value,b=$('toLeague').value,ai=+$('fromTeam').value,bi=+$('toTeam').value;if(a===b){msg('異なるリーグを選択してください');return}if(!confirm(`${a}リーグと${b}リーグの選択したチームを交換しますか？`))return;const {error}=await supabase.rpc('molkky_admin_swap_teams',{p_league_a:a,p_index_a:ai,p_league_b:b,p_index_b:bi,p_password:adminPassword});if(error){msg('交換失敗：'+error.message);return}await refresh();msg('チームを交換しました')};
$('login').onclick=async()=>{
  const pw=$('password').value;
  const {data,error}=await supabase.rpc('molkky_check_admin_password',{p_password:pw});
  if(error||!data){msg('パスワードが正しくありません');return}
  adminPassword=pw;$('password').value='';await check();
};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('login').click()});
$('logout').onclick=async()=>{adminPassword=null;await check()};
check();
</script></body></html>
